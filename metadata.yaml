name: ad-update-user
description: Update user attributes in on-premise Active Directory via LDAP

inputs:
  baseDN:
    type: text
    description: Base DN to search for the user (e.g., DC=corp,DC=example,DC=com)
    required: true
    validation:
      min: 1
      max: 500

  samAccountName:
    type: text
    description: The user's sAMAccountName (pre-Windows 2000 logon name) to lookup
    required: true
    validation:
      min: 1
      max: 256

  newSamAccountName:
    type: text
    description: New SAM account name if renaming (maps to sAMAccountName)
    required: false

  userPrincipalName:
    type: text
    description: User principal name / UPN (maps to userPrincipalName)
    required: false

  firstName:
    type: text
    description: First name (maps to givenName)
    required: false

  lastName:
    type: text
    description: Last name (maps to sn)
    required: false

  displayName:
    type: text
    description: Display name (maps to displayName)
    required: false

  email:
    type: text
    description: Email address (maps to mail)
    required: false

  company:
    type: text
    description: Company name (maps to company)
    required: false

  department:
    type: text
    description: Department name (maps to department)
    required: false

  title:
    type: text
    description: Job title (maps to title)
    required: false

  password:
    type: text
    description: New password for the user (encoded as unicodePwd UTF-16LE)
    required: false

  changePasswordAtNextLogin:
    type: boolean
    description: Force the user to change password at next login (sets pwdLastSet to 0)
    required: false

  additionalAttributes:
    type: object
    description: Object containing additional LDAP attribute names and values to update
    required: false

  dry_run:
    type: boolean
    description: When true, validates parameters and logs intended actions without making changes to Active Directory
    required: false

  address:
    type: text
    description: Optional LDAP server URL override
    required: false

outputs:
  status:
    type: text
    description: Operation result (success, halted)

  userDN:
    type: text
    description: The resolved Distinguished Name of the user

  modified:
    type: boolean
    description: Whether the user attributes were modified

  attributes:
    type: array
    description: List of attribute names that were updated

  address:
    type: text
    description: LDAP server address used

  message:
    type: text
    description: Additional status message or error details
