# yaml-language-server: $schema=https://raw.githubusercontent.com/sgnl-actions/schemas/main/metadata.schema.json
name: ad-update-user
description: Update user attributes in on-premise Active Directory via LDAP

inputs:
  baseDN:
    type: text
    description: Base DN to search for the user (e.g., DC=corp,DC=example,DC=com)
    required: true
    validation:
      min: 1
      max: 500

  samAccountName:
    type: text
    description: The user's sAMAccountName (pre-Windows 2000 logon name) to lookup. Required if objectGUID is not provided.
    required: false
    validation:
      min: 1
      max: 256

  objectGUID:
    type: text
    description: >
      The immutable objectGUID of the user in Active Directory. When provided,
      this is used for lookup instead of samAccountName, enabling updates even
      when the samAccountName is being changed. Format: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx.
    required: false

  newSamAccountName:
    type: text
    description: New SAM account name if renaming (maps to sAMAccountName)
    required: false

  userPrincipalName:
    type: text
    description: User principal name / UPN (maps to userPrincipalName)
    required: false

  firstName:
    type: text
    description: First name (maps to givenName)
    required: false

  lastName:
    type: text
    description: Last name (maps to sn)
    required: false

  displayName:
    type: text
    description: Display name (maps to displayName)
    required: false

  email:
    type: text
    description: Email address (maps to mail)
    required: false

  company:
    type: text
    description: Company name (maps to company)
    required: false

  department:
    type: text
    description: Department name (maps to department)
    required: false

  title:
    type: text
    description: Job title (maps to title)
    required: false

  password:
    type: text
    description: New password for the user (encoded as unicodePwd UTF-16LE)
    required: false

  changePasswordAtNextLogin:
    type: boolean
    description: Force the user to change password at next login (sets pwdLastSet to 0)
    required: false

  additionalAttributes:
    type: object
    description: Object containing additional LDAP attribute names and values to update
    required: false
    properties: {}

  dry_run:
    type: boolean
    description: When true, validates parameters and logs intended actions without making changes to Active Directory
    required: false

  address:
    type: text
    description: Optional LDAP server URL override
    required: false

outputs:
  status:
    type: text
    description: Operation result (success, halted)

  userDN:
    type: text
    description: The resolved Distinguished Name of the user

  modified:
    type: boolean
    description: Whether the user attributes were modified

  attributes:
    type: array
    description: List of attribute names that were updated

  baseDN:
    type: text
    description: The base DN used to search for the user

  samAccountName:
    type: text
    description: The sAMAccountName used to identify the user

  objectGUID:
    type: text
    description: The objectGUID used to identify the user

  address:
    type: text
    description: LDAP server address used

environment:
  ADDRESS:
    type: text
    description: LDAP server URL
    required: false
  TLS_SKIP_VERIFY:
    type: text
    description: Skip TLS certificate verification (set to 'true' to disable)
    required: false

secrets:
  BASIC_USERNAME:
    type: text
    description: LDAP bind username (Distinguished Name)
    required: true
  BASIC_PASSWORD:
    type: text
    description: LDAP bind password
    required: true
